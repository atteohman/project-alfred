<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROJECT ALFRED</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #globe-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Login layout ── */
    .login-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .access-label {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: #58a6ff;
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: 0.85;
    }

    .main-title {
      font-size: clamp(2rem, 5.5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #f0f6fc;
      text-align: center;
      text-shadow:
        0 0 60px rgba(88, 166, 255, 0.35),
        0 0 20px rgba(88, 166, 255, 0.15);
      animation: titlePulse 4s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 0 0 60px rgba(88,166,255,0.35), 0 0 20px rgba(88,166,255,0.15); }
      50%       { text-shadow: 0 0 80px rgba(88,166,255,0.55), 0 0 30px rgba(88,166,255,0.25); }
    }

    .title-rule {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(88,166,255,0.6), transparent);
      margin: 14px auto 10px;
    }

    .subtitle {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: #484f58;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 40px;
    }

    /* ── Card ── */
    .login-card {
      background: rgba(22, 27, 34, 0.82);
      border: 1px solid rgba(48, 54, 61, 0.9);
      border-radius: 12px;
      padding: 34px 38px 28px;
      width: 340px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 0 0 1px rgba(88,166,255,0.04),
        0 24px 48px rgba(0,0,0,0.5);
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.65rem;
      color: #8b949e;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 14px;
      color: #e6edf3;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
    }
    input[type="password"] { letter-spacing: 0.14em; }
    input::placeholder { color: #484f58; letter-spacing: 0.02em; }

    .login-btn {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      background: #58a6ff;
      border: none;
      border-radius: 6px;
      color: #0d1117;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      font-family: inherit;
    }
    .login-btn:hover {
      background: #79b8ff;
      box-shadow: 0 0 20px rgba(88,166,255,0.3);
    }
    .login-btn:active { transform: scale(0.98); }

    .error-msg {
      text-align: center;
      color: #f85149;
      font-size: 0.72rem;
      margin-top: 13px;
      min-height: 16px;
      opacity: 0;
      transition: opacity 0.2s;
      letter-spacing: 0.03em;
    }
    .error-msg.visible { opacity: 1; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-9px); }
      40%      { transform: translateX(9px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }
    .shake { animation: shake 0.38s ease; }

    @keyframes fadeOut { to { opacity: 0; transform: scale(0.96) translateY(-8px); } }
    .fade-out { animation: fadeOut 0.4s ease forwards; }

    .version {
      position: fixed;
      bottom: 16px; right: 20px;
      font-size: 0.6rem;
      color: #21262d;
      letter-spacing: 0.07em;
      z-index: 1;
      user-select: none;
    }
  </style>
</head>
<body>

<canvas id="globe-canvas"></canvas>

<div class="login-wrap" id="login-wrap">
  <div class="access-label">&#x25CF; Secure Access Terminal</div>
  <h1 class="main-title">PROJECT ALFRED</h1>
  <div class="title-rule"></div>
  <div class="subtitle">Advanced Live Field Reconnaissance &amp; Evaluation Dashboard</div>

  <div class="login-card">
    <div class="field">
      <label for="username">Access ID</label>
      <input type="text" id="username" placeholder="Enter access ID" autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label for="password">Authorization Code</label>
      <input type="password" id="password" placeholder="Enter authorization code" />
    </div>
    <button class="login-btn" onclick="handleLogin()">Authenticate</button>
    <div class="error-msg" id="error-msg">Access denied &mdash; invalid credentials</div>
  </div>
</div>

<div class="version">ALFRED v2.4.1 &bull; CLASSIFIED</div>

<script>
// ── Auth redirect ─────────────────────────────────────────────────────────────
if (sessionStorage.getItem("alfred_auth") === "true") {
  window.location.href = "menu.html";
}
document.addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });

function handleLogin() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;
  const wrap = document.getElementById("login-wrap");
  const err  = document.getElementById("error-msg");

  if (user === "Atte" && pass === "Batcave") {
    sessionStorage.setItem("alfred_auth", "true");
    wrap.classList.add("fade-out");
    setTimeout(() => window.location.href = "menu.html", 420);
  } else {
    err.classList.add("visible");
    wrap.classList.remove("shake");
    void wrap.offsetWidth;
    wrap.classList.add("shake");
    document.getElementById("password").value = "";
    setTimeout(() => wrap.classList.remove("shake"), 400);
  }
}

// ── Globe ─────────────────────────────────────────────────────────────────────
const canvas = document.getElementById("globe-canvas");
const ctx    = canvas.getContext("2d");

const RGB      = "88, 166, 255";
const TILT     = 23.5;   // Earth's real axial tilt in degrees
const SEGS     = 80;     // segments per arc (smoothness)
const LAT_STEP = 30;     // latitude lines every 30°
const LON_STEP = 30;     // longitude lines every 30°
const ROT_SPEED = 0.055; // degrees per frame

let W, H, cx, cy, R, rotY = 0;

// Precompute background stars (fixed positions)
const STARS = Array.from({ length: 160 }, () => ({
  x: Math.random(),
  y: Math.random(),
  r: 0.4 + Math.random() * 1.1,
  o: 0.05 + Math.random() * 0.18
}));

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  R  = Math.min(W, H) * 0.41;
}

// Orthographic projection with axial tilt
function project(lonDeg, latDeg) {
  const lr = (lonDeg + rotY) * Math.PI / 180;
  const pr = latDeg           * Math.PI / 180;
  const tr = TILT             * Math.PI / 180;

  const sx =  Math.cos(pr) * Math.sin(lr);
  const sy = -Math.sin(pr);
  const sz =  Math.cos(pr) * Math.cos(lr);

  // Rotate around X axis by tilt
  const ry = sy * Math.cos(tr) - sz * Math.sin(tr);
  const rz = sy * Math.sin(tr) + sz * Math.cos(tr);

  return { x: cx + R * sx, y: cy + R * ry, z: rz };
}

// Opacity based on depth (z normalized to [-1, 1])
function opacity(z) {
  if (z < 0) return Math.max(0, 0.025 + 0.018 * (z + 1));
  return 0.055 + 0.38 * z;
}

// Draw an arc as individual depth-shaded segments
function drawArc(pts) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const op = opacity((a.z + b.z) * 0.5);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(${RGB},${op.toFixed(3)})`;
    ctx.stroke();
  }
}

function frame() {
  ctx.clearRect(0, 0, W, H);

  // Stars
  for (const s of STARS) {
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${s.o})`;
    ctx.fill();
  }

  // Globe glow (radial gradient)
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.5);
  grd.addColorStop(0,    `rgba(${RGB},0.07)`);
  grd.addColorStop(0.45, `rgba(${RGB},0.03)`);
  grd.addColorStop(1,    `rgba(${RGB},0)`);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Atmosphere halo
  ctx.beginPath();
  ctx.arc(cx, cy, R + 4, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${RGB},0.06)`;
  ctx.lineWidth = 8;
  ctx.stroke();

  // Globe outline circle
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${RGB},0.20)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.lineWidth = 0.85;

  // Latitude parallels
  for (let lat = -90; lat <= 90; lat += LAT_STEP) {
    const pts = [];
    for (let i = 0; i <= SEGS; i++) {
      pts.push(project(-180 + (360 / SEGS) * i, lat));
    }
    drawArc(pts);
  }

  // Longitude meridians
  for (let lon = 0; lon < 360; lon += LON_STEP) {
    const pts = [];
    for (let i = 0; i <= SEGS; i++) {
      pts.push(project(lon, -90 + (180 / SEGS) * i));
    }
    drawArc(pts);
  }

  rotY += ROT_SPEED;
  requestAnimationFrame(frame);
}

resize();
window.addEventListener("resize", resize);
frame();
</script>
</body>
</html>

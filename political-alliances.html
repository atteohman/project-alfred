<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROJECT ALFRED — Alliance Network</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: none;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      font-size: 0.75rem;
      padding: 5px 12px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
      text-decoration: none;
    }
    .back-btn:hover { background: #21262d; color: #f0f6fc; }

    .brand-badge {
      background: rgba(88,166,255,0.1);
      border: 1px solid rgba(88,166,255,0.3);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #58a6ff;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-title { font-size: 1rem; font-weight: 600; color: #f0f6fc; letter-spacing: 0.02em; }
    .header-sub { font-size: 0.72rem; color: #8b949e; margin-top: 1px; }

    .network-container { flex: 1; position: relative; overflow: hidden; }

    #net-svg {
      width: 100%; height: 100%;
      cursor: grab;
    }
    #net-svg:active { cursor: grabbing; }

    /* Tooltip */
    #tooltip {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 0.78rem;
      color: #e6edf3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      white-space: nowrap;
      z-index: 10;
    }
    #tooltip.visible { opacity: 1; }

    /* Info Panel */
    #info-panel {
      position: absolute;
      right: 16px; top: 16px;
      width: 330px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      z-index: 20;
      transform: translateX(380px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: calc(100vh - 80px);
      overflow-y: auto;
    }
    #info-panel.open { transform: translateX(0); }

    .panel-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: #8b949e;
      font-size: 1.1rem; cursor: pointer; line-height: 1;
      padding: 2px 6px; border-radius: 4px;
    }
    .panel-close:hover { background: #21262d; color: #f0f6fc; }

    .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-right: 24px; }
    .panel-color-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
    .panel-title { font-size: 1.05rem; font-weight: 600; color: #f0f6fc; line-height: 1.3; }
    .panel-fullname { font-size: 0.72rem; color: #8b949e; margin-top: 1px; }

    .panel-stats {
      display: flex; gap: 0;
      margin-bottom: 16px;
      background: #0d1117;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #21262d;
    }
    .stat-item {
      flex: 1; padding: 10px 12px;
      border-right: 1px solid #21262d;
      text-align: center;
    }
    .stat-item:last-child { border-right: none; }
    .stat-value { font-size: 1rem; font-weight: 700; color: #f0f6fc; }
    .stat-label { font-size: 0.62rem; color: #484f58; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }

    .panel-section { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; margin-bottom: 8px; margin-top: 14px; }

    .panel-summary { font-size: 0.83rem; color: #c9d1d9; line-height: 1.65; margin-bottom: 4px; }

    .timeline { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
    .tl-item {
      display: flex; gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-year {
      font-size: 0.72rem; font-weight: 700;
      color: var(--accent, #58a6ff);
      min-width: 36px; flex-shrink: 0;
      padding-top: 1px;
    }
    .tl-event { font-size: 0.78rem; color: #8b949e; line-height: 1.5; }

    /* Country panel variant */
    .alliance-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
    .alliance-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
      border: 1px solid transparent;
    }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* Legend */
    #legend {
      position: absolute; left: 16px; bottom: 20px;
      background: rgba(22,27,34,0.9);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      z-index: 10;
      max-width: 200px;
    }
    .legend-title { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; color: #484f58; margin-bottom: 8px; }
    .legend-row { display: flex; align-items: center; gap: 7px; font-size: 0.72rem; color: #8b949e; margin-bottom: 4px; cursor: pointer; border-radius: 3px; padding: 2px 3px; transition: background 0.1s; }
    .legend-row:hover { background: #21262d; color: #e6edf3; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* Zoom controls */
    .zoom-controls {
      position: absolute; right: 16px; bottom: 20px;
      display: flex; flex-direction: column; gap: 4px; z-index: 10;
    }
    .zoom-btn {
      width: 32px; height: 32px;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .zoom-btn:hover { background: #21262d; color: #f0f6fc; }

    .hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; color: #484f58; pointer-events: none; white-space: nowrap;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  </style>
</head>

// ─── Build graph data ─────────────────────────────────────────────────────────
let width  = 0;
let height = 0;

function buildGraph() {
  const nodes = [];
  const links = [];

  // Alliance hub nodes
  for (const [id, a] of Object.entries(ALLIANCES)) {
    nodes.push({
      id,
      type: "alliance",
      label: a.label,
      color: a.color,
      fx: a.xf * width,
      fy: a.yf * height,
      r: 34
    });
  }

  // Country nodes — initial position = average of their alliance hubs
  for (const [code, c] of Object.entries(COUNTRIES)) {
    const avgX = c.a.reduce((s, aid) => s + ALLIANCES[aid].xf * width, 0) / c.a.length;
    const avgY = c.a.reduce((s, aid) => s + ALLIANCES[aid].yf * height, 0) / c.a.length;
    nodes.push({
      id: code,
      type: "country",
      label: code,
      name: c.name,
      alliances: c.a,
      color: ALLIANCES[c.a[0]].color,
      x: avgX + (Math.random() - 0.5) * 90,
      y: avgY + (Math.random() - 0.5) * 90,
      r: 9
    });

    // One link per alliance membership
    c.a.forEach(aid => {
      links.push({ source: code, target: aid, alliance: aid, color: ALLIANCES[aid].color });
    });
  }

  return { nodes, links };
}

// ─── SVG Setup ────────────────────────────────────────────────────────────────
const container = document.querySelector(".network-container");
const svgEl     = document.getElementById("net-svg");
const svg       = d3.select(svgEl);
const tooltip   = document.getElementById("tooltip");

function initSVG() {
  width  = container.clientWidth;
  height = container.clientHeight;

  svg.selectAll("*").remove();

  // Defs
  const defs = svg.append("defs");
  const glow = defs.append("filter").attr("id","glow").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
  glow.append("feGaussianBlur").attr("stdDeviation","5").attr("result","blur");
  const merge = glow.append("feMerge");
  merge.append("feMergeNode").attr("in","blur");
  merge.append("feMergeNode").attr("in","SourceGraphic");

  // Background dots
  const bgG = svg.append("g").attr("class","bg");
  const dotSpacing = 28;
  const cols = Math.ceil(width  / dotSpacing) + 1;
  const rows = Math.ceil(height / dotSpacing) + 1;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      bgG.append("circle")
        .attr("cx", c * dotSpacing)
        .attr("cy", r * dotSpacing)
        .attr("r", 0.8)
        .attr("fill", "#1c2128");
    }
  }

  return svg.append("g").attr("class","main");
}

// ─── Zoom ─────────────────────────────────────────────────────────────────────
const zoom = d3.zoom()
  .scaleExtent([0.4, 5])
  .on("zoom", e => mainG && mainG.attr("transform", e.transform));

svg.call(zoom);

document.getElementById("zoom-in").addEventListener("click",  () => svg.transition().duration(350).call(zoom.scaleBy, 1.5));
document.getElementById("zoom-out").addEventListener("click", () => svg.transition().duration(350).call(zoom.scaleBy, 0.67));
document.getElementById("zoom-reset").addEventListener("click", () => svg.transition().duration(600).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity));

// ─── Panel Logic ──────────────────────────────────────────────────────────────
const infoPanel = document.getElementById("info-panel");
let highlightedAlliance = null;
let edgeSel, allianceNodeSel, countryNodeSel;

function openAlliancePanel(id) {
  const a = ALLIANCES[id];
  if (!a) return;
  document.getElementById("panel-dot").style.background = a.color;
  document.getElementById("panel-title").textContent    = a.label;
  document.getElementById("panel-fullname").textContent = a.fullName;

  document.getElementById("panel-stats").innerHTML = `
    <div class="stat-item"><div class="stat-value">${a.memberCount}</div><div class="stat-label">Members</div></div>
    <div class="stat-item"><div class="stat-value">${a.founded.split(",")[0].split(" ").pop()}</div><div class="stat-label">Founded</div></div>
    <div class="stat-item" style="flex:2"><div class="stat-value" style="font-size:0.72rem;padding-top:2px">${a.hq}</div><div class="stat-label">Headquarters</div></div>
  `;

  document.getElementById("panel-summary").textContent = a.summary;

  const det = document.getElementById("panel-detail");
  det.innerHTML = `<div class="panel-section">Key Historical Events</div><div class="timeline" style="--accent:${a.color}"></div>`;
  const tl = det.querySelector(".timeline");
  a.events.forEach(ev => {
    const item = document.createElement("div");
    item.className = "tl-item";
    item.innerHTML = `<div class="tl-year">${ev.y}</div><div class="tl-event">${ev.e}</div>`;
    tl.appendChild(item);
  });

  infoPanel.classList.add("open");

  // Highlight edges
  highlightAlliance(id);
}

function openCountryPanel(code) {
  const c = COUNTRIES[code];
  if (!c) return;
  const primaryColor = ALLIANCES[c.a[0]].color;

  document.getElementById("panel-dot").style.background      = primaryColor;
  document.getElementById("panel-title").textContent    = c.name;
  document.getElementById("panel-fullname").textContent = `ISO: ${code} &bull; ${c.a.length} alliance${c.a.length > 1 ? "s" : ""}`;
  document.getElementById("panel-fullname").innerHTML   = `ISO: ${code} &nbsp;&bull;&nbsp; Member of ${c.a.length} alliance${c.a.length !== 1 ? "s" : ""}`;

  document.getElementById("panel-stats").innerHTML = `
    <div class="stat-item"><div class="stat-value">${c.a.length}</div><div class="stat-label">Alliances</div></div>
    <div class="stat-item" style="flex:3"><div class="stat-value" style="font-size:0.78rem;padding-top:2px">${c.name}</div><div class="stat-label">Full Name</div></div>
  `;

  document.getElementById("panel-summary").textContent = `${c.name} is a member of the following international political and military alliances:`;

  const det = document.getElementById("panel-detail");
  det.innerHTML = `<div class="panel-section">Alliance Memberships</div><div class="alliance-chips"></div>`;
  const chips = det.querySelector(".alliance-chips");
  c.a.forEach(aid => {
    const al = ALLIANCES[aid];
    const chip = document.createElement("div");
    chip.className = "alliance-chip";
    chip.style.background   = al.color + "22";
    chip.style.color        = al.color;
    chip.style.borderColor  = al.color + "55";
    chip.innerHTML = `<span class="chip-dot" style="background:${al.color}"></span>${al.label}`;
    chip.style.cursor = "pointer";
    chip.addEventListener("click", () => openAlliancePanel(aid));
    chips.appendChild(chip);
  });

  infoPanel.classList.add("open");
  highlightCountry(code);
}

function closePanel() {
  infoPanel.classList.remove("open");
  clearHighlight();
}

document.getElementById("panel-close-btn").addEventListener("click", closePanel);
svg.on("click.close", closePanel);

function highlightAlliance(aid) {
  if (!edgeSel) return;
  edgeSel.transition().duration(200)
    .attr("stroke-opacity", d => d.alliance === aid ? 0.9 : 0.04)
    .attr("stroke-width",   d => d.alliance === aid ? 2   : 1);
  if (countryNodeSel) countryNodeSel.select("circle")
    .transition().duration(200)
    .attr("opacity", d => d.alliances && d.alliances.includes(aid) ? 1 : 0.2);
  if (allianceNodeSel) allianceNodeSel.select("circle")
    .transition().duration(200)
    .attr("opacity", d => d.id === aid ? 1 : 0.35);
}

function highlightCountry(code) {
  if (!edgeSel) return;
  edgeSel.transition().duration(200)
    .attr("stroke-opacity", d => (d.source.id || d.source) === code ? 0.9 : 0.04)
    .attr("stroke-width",   d => (d.source.id || d.source) === code ? 2.5 : 1);
  if (countryNodeSel) countryNodeSel.select("circle")
    .transition().duration(200)
    .attr("opacity", d => d.id === code ? 1 : 0.25);
  if (allianceNodeSel) allianceNodeSel.select("circle")
    .transition().duration(200)
    .attr("opacity", d => COUNTRIES[code]?.a.includes(d.id) ? 1 : 0.35);
}

function clearHighlight() {
  if (!edgeSel) return;
  edgeSel.transition().duration(200).attr("stroke-opacity", 0.22).attr("stroke-width", 1.2);
  if (countryNodeSel) countryNodeSel.select("circle").transition().duration(200).attr("opacity", 1);
  if (allianceNodeSel) allianceNodeSel.select("circle").transition().duration(200).attr("opacity", 1);
}

// ─── Legend ───────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
for (const [id, a] of Object.entries(ALLIANCES)) {
  const row = document.createElement("div");
  row.className = "legend-row";
  row.innerHTML = `<span class="legend-swatch" style="background:${a.color}"></span>${a.label}`;
  row.addEventListener("click", e => { e.stopPropagation(); openAlliancePanel(id); });
  legendEl.appendChild(row);
}

// ─── Main Draw ────────────────────────────────────────────────────────────────
let mainG = null;

function draw() {
  width  = container.clientWidth;
  height = container.clientHeight;

  mainG = initSVG();

  const { nodes, links } = buildGraph();

  const edgesG     = mainG.append("g").attr("class","edges");
  const nodesG     = mainG.append("g").attr("class","nodes");

  // Edges
  edgeSel = edgesG.selectAll("line")
    .data(links)
    .join("line")
    .attr("stroke", d => d.color)
    .attr("stroke-opacity", 0.22)
    .attr("stroke-width", 1.2);

  // Simulation
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
      const src = typeof d.source === "object" ? d.source : nodes.find(n => n.id === d.source);
      return src?.type === "alliance" ? 100 : 90;
    }).strength(0.7))
    .force("charge", d3.forceManyBody().strength(d => d.type === "alliance" ? -2500 : -160))
    .force("collide", d3.forceCollide(d => d.type === "alliance" ? 58 : 16).strength(0.9))
    .on("tick", ticked);

  // Fix alliance positions
  nodes.filter(n => n.type === "alliance").forEach(n => {
    n.fx = ALLIANCES[n.id].xf * width;
    n.fy = ALLIANCES[n.id].yf * height;
  });

  // Alliance hub nodes
  allianceNodeSel = nodesG.selectAll(".anode")
    .data(nodes.filter(n => n.type === "alliance"))
    .join("g")
    .attr("class","anode")
    .style("cursor","pointer")
    .on("mouseover", function(event, d) {
      showTooltip(event, `<strong>${d.label}</strong> — ${ALLIANCES[d.id].fullName}`);
    })
    .on("mousemove", function(event) { moveTooltip(event); })
    .on("mouseleave", () => tooltip.classList.remove("visible"))
    .on("click", function(event, d) { event.stopPropagation(); openAlliancePanel(d.id); });

  allianceNodeSel.append("circle")
    .attr("r", d => d.r)
    .attr("fill", d => d.color + "28")
    .attr("stroke", d => d.color)
    .attr("stroke-width", 1.8)
    .attr("filter", "url(#glow)");

  allianceNodeSel.append("text")
    .text(d => d.label)
    .attr("text-anchor","middle")
    .attr("dominant-baseline","central")
    .attr("font-size", d => d.label.length > 5 ? "9px" : "11px")
    .attr("font-weight","700")
    .attr("fill", d => d.color)
    .attr("letter-spacing","0.04em")
    .style("pointer-events","none");

  // Country nodes
  countryNodeSel = nodesG.selectAll(".cnode")
    .data(nodes.filter(n => n.type === "country"))
    .join("g")
    .attr("class","cnode")
    .style("cursor","pointer")
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) sim.alphaTarget(0.15).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end",   (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on("mouseover", function(event, d) {
      showTooltip(event, `<strong>${d.name}</strong> (${d.label}) &mdash; ${d.alliances.map(a => ALLIANCES[a].label).join(", ")}`);
    })
    .on("mousemove", function(event) { moveTooltip(event); })
    .on("mouseleave", () => tooltip.classList.remove("visible"))
    .on("click", function(event, d) { event.stopPropagation(); openCountryPanel(d.id); });

  countryNodeSel.append("circle")
    .attr("r", 8)
    .attr("fill", d => d.color + "55")
    .attr("stroke", d => d.color)
    .attr("stroke-width", 1.2);

  countryNodeSel.append("text")
    .text(d => d.label)
    .attr("text-anchor","middle")
    .attr("dy","18")
    .attr("font-size","7.5px")
    .attr("fill","#8b949e")
    .attr("letter-spacing","0.03em")
    .style("pointer-events","none");

  function ticked() {
    edgeSel
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);
    allianceNodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
    countryNodeSel.attr("transform",  d => `translate(${d.x},${d.y})`);
  }
}

function showTooltip(event, html) {
  tooltip.innerHTML = html;
  tooltip.classList.add("visible");
  moveTooltip(event);
}
function moveTooltip(event) {
  const rect = container.getBoundingClientRect();
  let x = event.clientX - rect.left + 14;
  let y = event.clientY - rect.top  - 10;
  if (x + 320 > width) x -= 330;
  tooltip.style.left = x + "px";
  tooltip.style.top  = y + "px";
}

// ─── Init ─────────────────────────────────────────────────────────────────────
draw();

window.addEventListener("resize", () => {
  draw();
  closePanel();
});
</script>

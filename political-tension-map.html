<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 24px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; font-size: 0.75rem; padding: 5px 12px;
      cursor: pointer; letter-spacing: 0.03em; white-space: nowrap;
      transition: background 0.15s, color 0.15s; font-family: inherit; text-decoration: none;
    }
    .back-btn:hover { background: #21262d; color: #f0f6fc; }
    .brand-badge {
      background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.3);
      border-radius: 4px; padding: 3px 8px; font-size: 0.65rem;
      letter-spacing: 0.1em; color: #58a6ff; text-transform: uppercase; white-space: nowrap;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; color: #f0f6fc; }
    header p  { font-size: 0.72rem; color: #8b949e; margin-top: 2px; }

    .legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #8b949e; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    .map-container { flex: 1; position: relative; overflow: hidden; }

    #map-svg { width: 100%; height: 100%; cursor: grab; }
    #map-svg:active { cursor: grabbing; }

    .country {
      stroke: #30363d;
      stroke-width: 0.4px;
      transition: opacity 0.15s;
      cursor: pointer;
    }
    .country:hover { opacity: 0.75; stroke: #8b949e; stroke-width: 1px; }
    .country.selected { stroke: #f0f6fc; stroke-width: 1.8px; opacity: 1 !important; }

    .graticule { fill: none; stroke: #1c2128; stroke-width: 0.5px; }
    .sphere { fill: #0a1628; }
    .borders { fill: none; stroke: #30363d; stroke-width: 0.4px; pointer-events: none; }

    /* Tooltip */
    #tooltip {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      color: #e6edf3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      white-space: nowrap;
      z-index: 10;
    }
    #tooltip.visible { opacity: 1; }
    .tooltip-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }

    /* Info Panel */
    #info-panel {
      position: absolute;
      right: 16px;
      top: 16px;
      width: 330px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      z-index: 20;
      transform: translateX(380px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }
    #info-panel.open { transform: translateX(0); }

    .panel-close {
      position: absolute;
      top: 12px; right: 14px;
      background: none; border: none;
      color: #8b949e; font-size: 1.1rem;
      cursor: pointer; line-height: 1;
      padding: 2px 6px; border-radius: 4px;
    }
    .panel-close:hover { background: #21262d; color: #f0f6fc; }

    .panel-country {
      font-size: 1.15rem; font-weight: 600;
      color: #f0f6fc; margin-bottom: 14px;
      padding-right: 24px; line-height: 1.3;
    }

    /* Leader section */
    .leader-section {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #21262d;
    }

    .leader-img-wrap {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      background: #21262d;
      border: 2px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #leader-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      display: none;
      border-radius: 50%;
    }
    #leader-img.loaded { display: block; }

    #leader-placeholder {
      font-size: 2rem;
      color: #484f58;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .img-spinner {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .img-spinner::after {
      content: '';
      width: 22px; height: 22px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .img-spinner.hidden { display: none; }

    .leader-info { min-width: 0; }
    .leader-name {
      font-size: 0.88rem; font-weight: 600;
      color: #e6edf3; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leader-title-text { font-size: 0.73rem; color: #8b949e; line-height: 1.4; }
    .leader-wiki-link {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.68rem;
      color: #58a6ff;
      text-decoration: none;
    }
    .leader-wiki-link:hover { text-decoration: underline; }
    .no-leader-note { font-size: 0.75rem; color: #484f58; font-style: italic; }

    .tension-badge {
      display: inline-flex;
      align-items: center; gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem; font-weight: 600;
      margin-bottom: 14px;
      border: 1px solid transparent;
    }

    .tension-bar-wrap {
      background: #21262d;
      border-radius: 4px; height: 6px;
      margin-bottom: 16px; overflow: hidden;
    }
    .tension-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

    .panel-section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .panel-summary {
      font-size: 0.85rem; color: #c9d1d9;
      line-height: 1.6; margin-bottom: 16px;
    }

    .reasons-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .reasons-list li {
      font-size: 0.8rem; color: #8b949e;
      display: flex; align-items: flex-start;
      gap: 8px; line-height: 1.5;
    }
    .reasons-list li::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #58a6ff;
      margin-top: 6px; flex-shrink: 0;
    }

    /* Zoom controls */
    .zoom-controls {
      position: absolute;
      left: 16px; bottom: 20px;
      display: flex; flex-direction: column;
      gap: 4px; z-index: 10;
    }
    .zoom-btn {
      width: 32px; height: 32px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px; color: #8b949e;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .zoom-btn:hover { background: #21262d; color: #f0f6fc; }

    .hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem; color: #484f58;
      pointer-events: none; white-space: nowrap;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  </style>

    <div class="panel-section-title">Key Tension Factors</div>
    <ul class="reasons-list" id="panel-reasons"></ul>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in">+</button>
    <button class="zoom-btn" id="zoom-out">&#x2212;</button>
    <button class="zoom-btn" id="zoom-reset" title="Reset view" style="font-size:0.75rem;">&#x25A1;</button>
  </div>
  <div class="hint">Scroll to zoom &bull; Drag to pan &bull; Click a country for details</div>
</div>

  "408":{ name:"North Korea", level:4, summary:"North Korea has deployed tens of thousands of troops to fight alongside Russia in Ukraine, marking a dramatic and dangerous expansion of its international military role. In exchange, North Korea has reportedly received advanced weapons technology and satellite assistance from Russia. The nuclear program continues to advance.", reasons:["10,000–15,000+ troops deployed to Russia for Ukraine war — unprecedented move","Advanced nuclear arsenal with ICBMs capable of reaching US mainland","Declared South Korea a 'hostile state' — abandonment of reunification goal","Russia-DPRK military-technology exchange deepening","Chronic famine and food insecurity despite military-first spending"] },
  "410":{ name:"South Korea", level:2, summary:"South Korea navigated its worst political crisis in decades after President Yoon Suk-yeol's December 2024 martial law declaration and subsequent impeachment. Progressive opposition leader Lee Jae-myung won the June 2025 presidential election, restoring democratic normalcy — but the country remains deeply polarized. North Korea's troop deployments to Russia and its declared 'hostile state' classification of the South have elevated the military threat perception.", reasons:["Post-Yoon constitutional crisis — deep conservative-progressive polarization remains","North Korea's troop deployment to Russia and declared hostility raising threat level","Lee Jae-myung's presidency faces strong conservative opposition bloc","Trump alliance uncertainty — US troop presence and extended deterrence questioned","South Korea's export economy vulnerable to US-China tariff war","Gender polarization (young men vs. women) one of highest in any democracy"] },
  "414":{ name:"Kuwait", level:2, summary:"Kuwait faces chronic political deadlock between the elected parliament and the ruling Al-Sabah family, with frequent dissolutions and elections.", reasons:["Chronic executive-legislative gridlock","Regional tensions from Iran and proxy conflicts","Succession concerns within Al-Sabah ruling family"] },
  "417":{ name:"Kyrgyzstan", level:3, summary:"Kyrgyzstan has a history of revolutions and political upheaval. Under President Japarov, democratic norms are eroding, and border clashes with Tajikistan have shown the risk of inter-state conflict.", reasons:["Authoritarian consolidation under Japarov","Border conflict with Tajikistan over water and land","Russian influence and CSTO membership","History of coups and political instability"] },
  "418":{ name:"Laos", level:2, summary:"Laos is a one-party communist state that maintains stability through repression. Its growing economic and political dependency on China raises sovereignty concerns.", reasons:["Single-party LPRP rule with no political opposition","Deepening debt-trap dependency on China","Forced disappearances of civil society activists"] },
  "422":{ name:"Lebanon", level:3, summary:"Lebanon has made fragile political progress after electing a president in January 2025 — ending a two-year vacancy — and forming a reform-oriented government. Hezbollah was significantly weakened by Israel's 2024 campaign. Economic collapse continues and reconstruction of the south is only beginning.", reasons:["Ongoing economic depression — 80%+ poverty rate, collapsed banking system","Hezbollah weakened militarily but still the most powerful political-armed actor","Southern Lebanon devastated by 2024 Israel-Hezbollah war","Reconstruction financing uncertain while IMF reforms stall","Sectarian power-sharing system structurally incapable of reform"] },
  "430":{ name:"Liberia", level:2, summary:"Liberia has maintained peace since its civil wars ended. Challenges include weak institutions, corruption, and economic underdevelopment.", reasons:["Weak state institutions and judicial capacity","Corruption hampering development","Youth unemployment and poverty"] },
  "434":{ name:"Libya", level:4, summary:"Libya remains divided between two rival governments. Foreign powers back opposing sides, preventing unification more than a decade after the 2011 revolution.", reasons:["Two rival governments controlling different halves of country","Haftar's LNA vs. GNU — ongoing division and clashes","Foreign military presence: Turkey, Russia, UAE, Egypt","Migrant smuggling networks destabilizing the state"] },
  "466":{ name:"Mali", level:4, summary:"Mali's military junta expelled French and UN forces and invited Russian Wagner Group mercenaries. Jihadist groups have expanded territory dramatically and the junta has pulled out of ECOWAS.", reasons:["Military junta expelling French/UN forces, inviting Wagner","Jihadist groups (JNIM linked to Al-Qaeda) controlling vast territory","Withdrawal from ECOWAS and regional isolation","Humanitarian crisis with millions displaced"] },
  "484":{ name:"Mexico", level:3, summary:"Mexico faces a security crisis driven by powerful drug cartels that outgun the state in many regions. Journalist and politician assassinations are at record levels.", reasons:["Cartel territorial wars causing 30,000+ homicides annually","Cartel infiltration of state and municipal governments","Mass disappearances — 100,000+ missing persons","Journalist and candidate assassinations","US-Mexico tensions over fentanyl trafficking"] },
  "496":{ name:"Mongolia", level:1, summary:"Mongolia is a stable parliamentary democracy between Russia and China. Its main vulnerability is economic dependency on both neighbors and corruption within the political system.", reasons:["Geopolitical squeeze between Russia and China","Mining resource corruption","Economic volatility from commodity prices"] },
  "504":{ name:"Morocco", level:2, summary:"Morocco has modernized under King Mohammed VI but maintains an authoritarian system. The Western Sahara territorial dispute remains a chronic flashpoint.", reasons:["Western Sahara territorial dispute with Polisario/Algeria","Suppression of Hirak Rif protest movement","Press freedom restrictions and political prisoners"] },
  "508":{ name:"Mozambique", level:3, summary:"Mozambique faces a long-running jihadist insurgency in Cabo Delgado province (linked to ISIS). Disputed 2024 elections also triggered deadly protests nationwide.", reasons:["ISIS-linked insurgency in Cabo Delgado","1 million displaced by northern insurgency","Post-election violence following disputed 2024 results"] },
  "516":{ name:"Namibia", level:1, summary:"Namibia is one of Africa's more stable democracies, though it faces significant inequality and debates over colonial-era land restitution.", reasons:["Extreme economic inequality and land ownership disparities","German colonial reparations dispute","Youth unemployment"] },
  "524":{ name:"Nepal", level:2, summary:"Nepal has political instability from frequent government collapses. China-India competition for influence, border disputes, and Maoist-party dynamics create ongoing tensions.", reasons:["Chronic political instability with frequent government changes","India-China strategic competition over Nepal","Border disputes with India"] },
  "528":{ name:"Netherlands", level:1, summary:"The Netherlands saw the far-right PVV of Geert Wilders emerge as the largest party in 2023, leading a coalition government. Immigration and integration remain highly contested issues.", reasons:["Far-right PVV in government — immigration policy controversies","Farmers' protests over nitrogen emission regulations","Dutch-Moroccan community tensions"] },
  "558":{ name:"Nicaragua", level:4, summary:"Nicaragua under Daniel Ortega is a full authoritarian state. The Catholic Church has been persecuted, all opposition parties banned, independent media shuttered, and hundreds of political prisoners held.", reasons:["Ortega's authoritarian consolidation after 2018 crackdown","Persecution and expulsion of Catholic clergy","All meaningful political opposition banned","Hundreds of political prisoners","Independent media entirely eliminated"] },
  "562":{ name:"Niger", level:4, summary:"Niger's 2023 military coup ousted President Bazoum and expelled French forces. The junta joined Mali and Burkina Faso in the Alliance of Sahel States, pulling away from Western security partnerships.", reasons:["Military junta rule since July 2023 coup","French and US forces expelled","Jihadist violence (JNIM, ISGS) continuing","Withdrawal from ECOWAS and regional isolation","Alliance with Mali and Burkina Faso military juntas"] },
  "566":{ name:"Nigeria", level:3, summary:"Nigeria faces multiple simultaneous security crises: Boko Haram/ISWAP in the northeast, banditry in the northwest, Biafra separatism in the southeast, and Fulani-farmer conflict in the Middle Belt.", reasons:["ISWAP/Boko Haram terrorism in northeast","Bandit gangs controlling northwest states","Biafra (IPOB) separatist movement","Farmer-herder communal violence","Economic crisis: naira collapse and inflation"] },
  "586":{ name:"Pakistan", level:4, summary:"Pakistan is simultaneously managing a political crisis, a raging insurgency, and nuclear-armed rivalry with India. Former PM Imran Khan remains imprisoned; his PTI movement is suppressed but retains mass support. The Pakistani Taliban (TTP) — operating from Afghan bases with Taliban protection — has dramatically escalated attacks in KPK and Balochistan. The military dominates civilian politics. Pakistan-India relations remain structurally hostile.", reasons:["Imran Khan imprisoned — PTI suppressed but retains massive popular support","TTP attacks surging: record civilian and security force deaths in 2024-25","Military's ISI continuing to dominate civilian political space","Nuclear-armed India-Pakistan rivalry — Indus Water Treaty tensions","Chronic balance of payments crises requiring repeated IMF rescues","Balochistan separatist insurgency intensifying alongside TTP attacks"] },
  "591":{ name:"Panama", level:2, summary:"Panama saw massive protests in 2023 over a copper mine contract. Canal strategic importance creates geopolitical pressures and US pressure over migration flows through the Darién Gap.", reasons:["Copper mine (Cobre Panama) controversy and protests","Canal strategic importance creating geopolitical pressures","US pressure over migration flows through Darién Gap","Corruption scandals affecting public trust"] },
  "604":{ name:"Peru", level:3, summary:"Peru has had six presidents in six years. President Boluarte took power after Castillo's self-coup attempt. Congress and the executive remain locked in conflict.", reasons:["Extreme political instability — 6 presidents in 6 years","2022-23 protests suppressed with deadly force","Ongoing conflict between executive and Congress","High corruption at all levels of government"] },
  "608":{ name:"Philippines", level:3, summary:"The Philippines faces a dramatic political break between President Marcos Jr. and the Duterte family, while China's aggressive actions in the South China Sea create constant maritime tensions.", reasons:["China's aggressive harassment of Philippine vessels","Philippine-China water cannon and ship collision incidents","Marcos-Duterte political alliance collapse","Communist New People's Army (NPA) insurgency","Abu Sayyaf jihadist group in Mindanao"] },
  "616":{ name:"Poland", level:2, summary:"Poland transitioned from the nationalist PiS government to a pro-EU coalition under PM Tusk. The new government faces the challenge of restoring judicial independence while managing its eastern border amid the Ukraine war.", reasons:["Ukraine war on neighboring border — direct security threat","Russia and Belarus orchestrating hybrid migration at borders","Domestic tensions over reversing PiS judicial changes","Deepening societal polarization between PiS and Tusk blocs"] },
  "634":{ name:"Qatar", level:2, summary:"Qatar has navigated the Gulf blockade crisis and used the 2022 FIFA World Cup for soft power, but faces criticism over migrant worker conditions. It plays a key mediation role in Gaza ceasefire talks.", reasons:["Criticism over migrant worker kafala system and deaths","Regional rivalries with Saudi Arabia and UAE","Hamas political bureau hosting creating Western tensions","Balancing Iran and Gulf state relations"] },
  "643":{ name:"Russia", level:5, summary:"Russia continues its full-scale war against Ukraine into its fourth year. Ceasefire negotiations mediated through US-Russia direct talks (restarted under Trump) have produced speculation but no agreement. Russia has deployed North Korean troops alongside its own forces. The economy is overheating under war footing with inflation above 9% despite rate hikes above 21%.", reasons:["Full-scale war against Ukraine with no end in sight — 4th year","Trump-Russia diplomatic re-engagement creating uncertainty over Ukraine support","North Korean troops integrated into Russian frontline units","Economy overheating — 21%+ interest rates, labour shortages, inflation","Political prisoners — post-Navalny era with all dissent criminalized","Nuclear rhetoric used as strategic deterrent against Western escalation"] },
  "646":{ name:"Rwanda", level:3, summary:"Rwanda is well-governed domestically, but its support for the M23 rebel group in DRC has triggered international condemnation, sanctions threats, and regional conflict dynamics.", reasons:["Backing of M23 rebels in DRC — backed by UN investigations","International condemnation and sanctions threats","Authoritarian governance with no meaningful political opposition","Assassinations of opponents abroad"] },
  "682":{ name:"Saudi Arabia", level:2, summary:"Saudi Arabia under Crown Prince MBS has undertaken a remarkable social and economic liberalisation while tightening political control. The Gaza war effectively froze Saudi-Israel normalisation. Saudi-Houthi dialogue has reduced (but not ended) Houthi missile and drone attacks on Saudi territory. Saudi Arabia is asserting unprecedented geopolitical independence, hosting US-Russia negotiations on Ukraine while maintaining China energy ties.", reasons:["Houthi missile and drone attacks still occurring despite Saudi-Houthi dialogue","Gaza war froze Saudi-Israel normalisation — politically untenable domestically","MBS authoritarian rule: Khashoggi killing unresolved, dissidents imprisoned","Yemen remains unresolved — risk of Houthi permanent enclave on Saudi border","Oil price dependency: ARAMCO funding Vision 2030 requires sustained oil revenues","US-Saudi relations complex under Trump: weapons deals vs. democratic values tension"] },
  "686":{ name:"Senegal", level:2, summary:"Senegal had a tense 2024 political crisis when former President Sall attempted to delay elections, but backed down after mass protests. New President Faye has taken office in a historic democratic renewal.", reasons:["2024 election crisis — delayed vote attempt and protests","Separatist conflict in Casamance region (low intensity)","Economic pressures and youth unemployment"] },
  "688":{ name:"Serbia", level:3, summary:"Serbia under Vucic balances between EU integration and alignment with Russia and China. Mass anti-corruption protests erupted in 2024-25 after a train station roof collapse. Kosovo's independence remains an irresolvable flashpoint.", reasons:["Kosovo independence dispute — Serbia refuses recognition","Mass anti-corruption protests following Novi Sad station collapse","Balancing EU membership aspirations with Russia/China ties","Suppression of media and political opposition"] },
  "706":{ name:"Somalia", level:4, summary:"Somalia remains one of the world's most fragile states. Al-Shabaab controls significant rural territory and carries out frequent deadly attacks in Mogadishu and beyond.", reasons:["Al-Shabaab controlling major rural areas and attacking cities","Federal-regional government conflict over authority","Houthi and piracy activity in adjacent waters","Chronic drought and food insecurity"] },
  "716":{ name:"Zimbabwe", level:3, summary:"Zimbabwe under Mnangagwa's ZANU-PF remains an authoritarian state with a collapsed economy. Opposition suppression and human rights abuses persist.", reasons:["ZANU-PF authoritarian rule and manipulation of elections","Economic collapse and high poverty","Suppression of opposition","Widespread political repression","Land reform legacy creating food insecurity"] },
  "724":{ name:"Spain", level:2, summary:"Spain manages tensions over Catalan independence — the major separatist leaders received amnesty in 2024. Coalition politics under PM Sanchez are fragile and the far-right Vox party is a significant force.", reasons:["Catalan independence movement — amnesty law controversy","Fragile parliamentary coalition requiring separatist support","Far-right Vox party growing political influence","Basque ETA legacy and ongoing separatist sentiment"] },
  "728":{ name:"South Sudan", level:5, summary:"South Sudan has effectively returned to civil war. Fighting between forces loyal to President Kiir and VP Machar's SPLM-IO erupted in 2025, shattering the Revitalized Peace Agreement. Multiple states face active combat and the UN has warned of mass atrocity risks. The country faces famine, the largest displacement crisis in its history, and political collapse.", reasons:["Return to active civil war between Kiir and Machar forces (2025)","Peace agreement (R-ARCSS) collapsed — security mechanisms non-functional","Famine-level food insecurity affecting millions","Over 4 million refugees in neighbouring countries","Sudan's own civil war has cut off vital supply corridors","International community capacity severely strained by multiple crises"] },
  "729":{ name:"Sudan", level:5, summary:"Since April 2023, Sudan has been engulfed in a catastrophic civil war between the Sudanese Armed Forces (SAF) and the Rapid Support Forces (RSF) paramilitaries. The RSF has committed ethnic cleansing in Darfur.", reasons:["Civil war between SAF and RSF since April 2023","RSF ethnic cleansing in Darfur — genocide allegations","World's largest displacement crisis (10+ million displaced)","Collapse of health system and famine in multiple states","Foreign involvement: UAE (RSF), Egypt (SAF)"] },
  "740":{ name:"Suriname", level:2, summary:"Suriname is navigating major offshore oil discoveries with fiscal and governance challenges.", reasons:["Oil wealth management and governance capacity concerns","Historical political instability legacy","High debt and economic challenges"] },
  "756":{ name:"Switzerland", level:1, summary:"Switzerland is consistently among the world's most stable and peaceful countries. Its neutrality has been tested by pressure to align with EU sanctions on Russia.", reasons:["Debate over neutrality vs. supporting Ukraine sanctions","Immigration and asylum policy political debates"] },
  "760":{ name:"Syria", level:3, summary:"Following Assad's fall in December 2024, the HTS-led transitional government under Ahmad al-Sharaa has maintained a degree of order in Damascus and is seeking international legitimacy. Some Western sanctions have been eased. Significant risks remain from multiple armed factions, continued ISIS activity, and Turkish-Kurdish tensions in the northeast.", reasons:["Fragile HTS-led transitional government with limited nationwide authority","Turkish military operations against Kurdish SDF in northeast","Continued ISIS attacks particularly in desert regions","Millions of refugees not yet returning; country's infrastructure devastated","Competing armed factions — rebel coalitions, Druze militias, SDF","Israel conducting strikes on Syrian military sites post-Assad"] },
  "762":{ name:"Tajikistan", level:3, summary:"Tajikistan is an authoritarian state bordering Afghanistan. The Taliban's takeover has heightened security concerns, and border conflicts with Kyrgyzstan have caused significant casualties.", reasons:["Taliban-controlled Afghanistan on border","2022 border war with Kyrgyzstan","Authoritarian Rahmon family dynastic rule","Drug trafficking corridor from Afghanistan"] },
  "764":{ name:"Thailand", level:3, summary:"Thailand's progressive 'Move Forward/People's Party' won the 2023 elections but was blocked by the military-appointed senate. Democratic aspirations clash with military-royalist power structures.", reasons:["Military-royalist establishment blocking democratic mandates","Constitutional court removing elected officials","Youth movement demanding monarchy reform","Regional separatist insurgency in deep south"] },
  "788":{ name:"Tunisia", level:3, summary:"Tunisia, the Arab Spring's only initially successful democracy, has reverted to authoritarianism under President Saied, who dissolved parliament in 2021 and has imprisoned opposition leaders.", reasons:["Presidential coup concentrating all power in Saied","Imprisonment of opposition leaders, journalists, and judges","New constitution eliminating democratic checks","Economic crisis and high unemployment"] },
  "792":{ name:"Turkey", level:3, summary:"Turkey under Erdoğan faces significant domestic tensions. The March 2025 arrest of Istanbul Mayor Ekrem İmamoğlu — the main opposition presidential candidate — triggered the largest mass protests in over a decade. Inflation has eased from its 2023 peak but economic hardship persists.", reasons:["Arrest of Istanbul Mayor İmamoğlu triggering major protests (March 2025)","Systemic erosion of judicial independence and press freedom","Kurdish PKK conflict and Turkish military operations in Syria/Iraq","Inflation easing from 85% peak but still high; lira weak","Balancing NATO membership with independent Russia and Iran relationships"] },
  "800":{ name:"Uganda", level:3, summary:"Uganda under Museveni (in power since 1986) passed the world's harshest anti-LGBTQ law in 2023, drawing international condemnation and sanctions. ADF insurgency and DRC instability add security dimensions.", reasons:["Draconian anti-LGBTQ law with death penalty provisions","Museveni's 38-year authoritarian rule","Western sanctions over human rights abuses","ADF (ISIS-linked) insurgency in western Uganda"] },
  "804":{ name:"Ukraine", level:5, summary:"Ukraine is in its fourth year of full-scale war with Russia. US-Russia bilateral talks under Trump have raised fears of a deal imposed on Ukraine without Ukrainian input. Ukraine is fighting from a defensive posture with some front-line pressure, while continuing to strike deep into Russian territory. EU financial support has increased to partially offset reduced US military aid.", reasons:["Active full-scale war with Russia — frontline under pressure in Donetsk","Trump-Russia talks raising fears of unfavorable imposed ceasefire","US military aid paused then partially resumed — ongoing uncertainty","EU has stepped up financial and military support","Energy infrastructure repeatedly targeted — millions without heat/power in winter","Demographic crisis: casualties, emigration, low birth rate"] },
  "818":{ name:"Egypt", level:3, summary:"Egypt under President Sisi maintains order through authoritarian control, but faces economic crisis including IMF dependency, currency devaluation, and Gaza-generated pressure on Sinai.", reasons:["Gaza war pressures — potential refugee influx risk","Severe economic crisis: currency crisis, inflation, debt","Political prisoners numbering in the tens of thousands","Muslim Brotherhood suppression","Sinai jihadist insurgency","Nile dam dispute with Ethiopia"] },
  "826":{ name:"United Kingdom", level:1, summary:"The UK is a stable democracy managing the aftereffects of Brexit. The new Labour government faces economic challenges and must navigate Scotland's independence sentiment.", reasons:["Scottish independence movement","Post-Brexit economic adjustment","Asylum seeker policy controversies","Northern Ireland post-Brexit protocol"] },
  "840":{ name:"United States", level:3, summary:"The United States is engaged in active military operations against Iranian-backed forces: a sustained bombing campaign against Houthi infrastructure in Yemen (March 2025 onwards) and retaliatory strikes against IRGC-aligned militias in Iraq and Syria after attacks on US troops. Domestically, Trump's second term is reshaping the constitutional order — DOGE mass-fired federal workers, agencies are being dismantled, and institutional norms are under their most severe strain since Watergate.", reasons:["Active military operations against Iranian-backed Houthis in Yemen — sustained bombing campaign","US forces struck by Iranian proxy militias in Iraq/Syria; US retaliated with direct strikes","145%+ tariffs on China, 25% on Canada/Mexico — largest US trade war in history triggering global recession risk","Executive overreach: DOGE, agency dismantling, alleged court order defiance","Extreme political polarization — institutions under stress with no modern precedent","Reduction of NATO commitment and Ukraine support creating alliance anxiety"] },
  "854":{ name:"Burkina Faso", level:4, summary:"Burkina Faso has had two military coups since 2022 and is losing territory to jihadist groups at an alarming rate. The junta expelled French forces, invited Russian Wagner mercenaries, and left ECOWAS.", reasons:["Jihadist groups (JNIM) controlling 40%+ of national territory","Two military coups in 2022","French forces expelled, Russian Wagner mercenaries invited","Withdrawal from ECOWAS","Over 2 million internally displaced"] },
  "858":{ name:"Uruguay", level:1, summary:"Uruguay is consistently ranked as South America's most democratic and peaceful country, with strong institutions, low corruption, and high human development.", reasons:["Occasional fiscal tensions around pension reform","Drug transit activity from neighboring countries"] },
  "860":{ name:"Uzbekistan", level:2, summary:"Uzbekistan under President Mirziyoyev has undertaken significant economic and social reforms, opening the economy and reducing some repression. However, it remains an authoritarian state.", reasons:["Authoritarian single-party governance","2022 Karakalpakstan autonomy protests suppressed violently","Balancing Russia, China, and Western economic interests"] },
  "862":{ name:"Venezuela", level:4, summary:"Venezuela's 2024 presidential election was stolen by Maduro through massive fraud, triggering nationwide protests that were violently suppressed. Over 200 people were killed and thousands arrested.", reasons:["Election fraud denying Maduro's defeat in 2024","Violent suppression of post-election protests — 200+ killed","Humanitarian catastrophe: 7+ million Venezuelans fled the country","Hyperinflation and economic collapse","Nicolás Maduro indicted by US on narco-terrorism charges"] },
  "887":{ name:"Yemen", level:4, summary:"Yemen remains deeply fractured. The Houthis (Ansar Allah) control most of northern Yemen and continued Red Sea shipping attacks well into 2025 despite US/UK retaliatory strikes. A Saudi-Houthi dialogue is ongoing, exploring a political settlement that would entrench Houthi control of the north. The humanitarian crisis remains catastrophic.", reasons:["Houthi Red Sea attacks continuing — global shipping significantly disrupted","US/UK military strikes on Houthi infrastructure escalating regional risk","Saudi-Houthi political dialogue raising prospect of Houthi legitimisation","Yemen's Internationally Recognized Government weakening politically","Catastrophic humanitarian crisis: 21+ million needing aid","Iran continues supplying advanced ballistic missiles and drones to Houthis"] },
  "894":{ name:"Zambia", level:2, summary:"Zambia achieved a peaceful democratic transition in 2021 but is navigating a severe debt crisis requiring restructuring.", reasons:["Debt restructuring and IMF austerity measures","Youth unemployment and poverty","Political polarization between UPND and opposition PF"] },

  "40":  { name:"Austria", level:2, summary:"Austria's far-right Freedom Party (FPÖ) under Herbert Kickl won the September 2024 elections and formed a government in early 2025 — the first time the FPÖ has led a government. Its eurosceptic and pro-Russia positions create friction within the EU and concern among Western partners.", reasons:["FPÖ far-right government — first time leading Austria","Kickl's pro-Russia stance and resistance to Ukraine sanctions","Eurosceptic tensions within EU framework","Migration and asylum controversies"] },

  "48":  { name:"Bahrain", level:3, summary:"Bahrain has been in a prolonged state of political repression since violently crushing the 2011 Arab Spring uprising. The Shia majority population remains politically marginalized under the Sunni Al-Khalifa monarchy, with thousands of political prisoners and civil society effectively eliminated.", reasons:["Systematic repression of Shia majority population","Thousands of political prisoners post-2011 uprising","Civil society and opposition outlawed","Total dependence on Saudi Arabia for political survival","Regional Iran-Saudi proxy dynamics"] },

  "51":  { name:"Armenia", level:3, summary:"Armenia lost Nagorno-Karabakh to Azerbaijan in September 2023, triggering the displacement of 100,000+ ethnic Armenians. The country is reorienting geopolitically toward the EU, withdrawing from CSTO, and negotiating a peace treaty with Azerbaijan while managing internal political tensions.", reasons:["Loss of Nagorno-Karabakh — 100,000+ Armenian refugees from enclave","Negotiating peace treaty with Azerbaijan under international pressure","Withdrawal from CSTO — security vacuum while Russian protection ends","PM Pashinyan facing domestic opposition over Karabakh loss","Unresolved border demarcation creating ongoing risk of incidents"] },

  "72":  { name:"Botswana", level:1, summary:"Botswana achieved a landmark peaceful democratic transition in 2024, with the ruling BDP losing power for the first time in 58 years. New President Duma Boko has pledged anti-corruption reforms. Botswana remains one of Africa's most stable and well-governed democracies.", reasons:["Declining diamond revenues raising long-term fiscal challenges","Youth unemployment despite relative prosperity","Political transition bringing new governance dynamics"] },

  "96":  { name:"Brunei", level:2, summary:"Brunei is an absolute monarchy with Sharia law partially applied. Political parties are effectively banned. The country is wealthy from oil but faces long-term questions about economic diversification.", reasons:["Absolute monarchy with no political pluralism","Sharia criminal code provisions including flogging and death penalty for homosexuality","Oil dependency and long-term economic diversification challenges"] },

  "108": { name:"Burundi", level:4, summary:"Burundi remains one of Africa's most repressive and impoverished states. The ruling CNDD-FDD party maintains power through violence and intimidation. Over 400,000 refugees remain abroad following the 2015 crisis.", reasons:["Authoritarian CNDD-FDD rule with systematic repression","Ongoing Imbonerakure youth militia violence","Hundreds of thousands of refugees unable to return","Extreme poverty — one of world's poorest nations","Regional tensions with Rwanda"] },

  "148": { name:"Chad", level:4, summary:"Chad's transitional leader Mahamat Idriss Déby, who took power in a coup after his father's death in 2021, won a dubious 2024 presidential election. Sahel instability, armed groups on multiple borders, and the expulsion of French forces make Chad highly vulnerable.", reasons:["Military-transitional government — Déby clan perpetuating dynastic rule","Sahel jihadist spillover from Sudan, CAR, Niger, and Nigeria","2024 expulsion of French forces removed key security guarantor","Sudan civil war creating enormous refugee influx (1 million+)","Extreme poverty and one of lowest HDI scores globally"] },

  "196": { name:"Cyprus", level:3, summary:"Cyprus remains divided since Turkey's 1974 invasion, with the northern third administered as the Turkish Republic of Northern Cyprus (recognised only by Turkey). Reunification negotiations remain stalled. Gas discoveries in Cypriot waters have created new tensions with Turkey.", reasons:["Island partition unresolved — Turkish military occupation of north","Turkish provocations over Cypriot EEZ gas exploration rights","Reunification talks stalled with no credible pathway","EU member but unable to apply EU law in northern territory"] },

  "203": { name:"Czech Republic", level:1, summary:"The Czech Republic is a stable NATO and EU democracy. The country has been one of Ukraine's most consistent supporters, sending significant military and humanitarian aid. Domestic politics saw the centre-right ODS-led coalition governing with a stable majority.", reasons:["Ukraine war on regional doorstep — security concerns","Energy transition costs after Russian gas dependency","Minority Roma community facing discrimination"] },

  "204": { name:"Benin", level:2, summary:"Benin has historically been a model of democratic governance in West Africa, but President Talon has presided over democratic backsliding including opposition exclusion from elections. The jihadist spillover from Burkina Faso into northern Benin is a growing security threat.", reasons:["Jihadist groups expanding from Burkina Faso into northern Benin","Democratic backsliding under Talon — opposition excluded","Tourism and economic pressure from regional instability"] },

  "214": { name:"Dominican Republic", level:2, summary:"The Dominican Republic is a relatively stable Caribbean democracy. President Abinader won re-election in 2024. Tensions with Haiti over migration and the Haitian crisis next door are major concerns, as is deep inequality.", reasons:["Haitian political collapse creating massive migration pressure","Deep inequality and poverty despite economic growth","Corruption and informal economy challenges","Drug trafficking transit routes"] },

  "222": { name:"El Salvador", level:2, summary:"El Salvador under President Bukele (re-elected in 2024) has achieved a dramatic security transformation through mass gang crackdowns. Homicides have fallen by 80%+, making it one of the safer countries in the region. However, concerns about authoritarian consolidation, human rights of detainees, and economic sustainability persist.", reasons:["Authoritarian governance — independent institutions weakened","Mass incarceration raising due process concerns","Economic dependency on remittances and vulnerability to US policy","Bitcoin legal tender experiment creating IMF friction"] },

  "233": { name:"Estonia", level:2, summary:"Estonia, a NATO and EU frontline state bordering Russia, faces significant hybrid warfare threats. Russia has used Estonia as a target for cyberattacks, disinformation, and border provocations. The country has significantly increased defence spending and is one of Ukraine's strongest supporters.", reasons:["Direct border with Russia and threat of hybrid warfare","Cyberattack and disinformation campaigns from Russia","Large Russian-speaking minority requiring integration effort","High defence spending strain on public finances"] },

  "242": { name:"Fiji", level:2, summary:"Fiji returned to civilian democratic rule after 2022 elections ended military leader Bainimarama's long dominance. The new coalition government faces economic and climate change challenges.", reasons:["Climate change — sea level rise an existential threat","Recent history of coups and fragile democratic consolidation","Economic vulnerability and high debt","Great-power competition between US, China, and Australia for Pacific influence"] },

  "266": { name:"Gabon", level:3, summary:"Gabon experienced a military coup in August 2023 that ousted President Ali Bongo Ondimba after disputed elections. The military junta led by Brice Oligui Nguema has pledged a transition to civilian rule. Oil wealth is concentrated in elite hands while the population remains poor.", reasons:["Military coup August 2023 — junta running transitional government","Uncertain timeline for return to civilian rule","Oil wealth inequality — elite enrichment vs. widespread poverty","Spillover of Sahel instability and regional coup contagion"] },

// ─── Constants ────────────────────────────────────────────────────────────────
const LEVEL_COLORS = { 1:"#2d6a4f", 2:"#52b788", 3:"#f4a261", 4:"#e76f51", 5:"#9d0208" };
const LEVEL_LABELS = { 1:"Stable", 2:"Low Tension", 3:"Moderate Tension", 4:"High Tension", 5:"Critical / Active Conflict" };
const LEVEL_BG     = { 1:"rgba(45,106,79,0.2)", 2:"rgba(82,183,136,0.2)", 3:"rgba(244,162,97,0.2)", 4:"rgba(231,111,81,0.2)", 5:"rgba(157,2,8,0.2)" };

// ─── Map Setup ────────────────────────────────────────────────────────────────
const svgEl    = document.getElementById("map-svg");
const svg      = d3.select(svgEl);
const container = document.querySelector(".map-container");

let width  = container.clientWidth;
let height = container.clientHeight;

const projection = d3.geoNaturalEarth1();
const path       = d3.geoPath().projection(projection);

const g         = svg.append("g");
const sphereEl  = g.append("path").datum({type:"Sphere"}).attr("class","sphere");
const graticule = g.append("path").datum(d3.geoGraticule()()).attr("class","graticule");
const countriesG = g.append("g");
const bordersG   = g.append("g");

function fitMap() {
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  projection.fitSize([width, height], {type:"Sphere"});
  sphereEl.attr("d", path({type:"Sphere"}));
  graticule.attr("d", path(d3.geoGraticule()()));
  countriesG.selectAll(".country").attr("d", d => path(d));
  bordersG.selectAll("path").attr("d", d => path(d));
}

// ─── Zoom ─────────────────────────────────────────────────────────────────────
const zoom = d3.zoom()
  .scaleExtent([0.8, 12])
  .on("zoom", e => g.attr("transform", e.transform));

svg.call(zoom);

document.getElementById("zoom-in").addEventListener("click",  () => svg.transition().duration(400).call(zoom.scaleBy, 1.6));
document.getElementById("zoom-out").addEventListener("click", () => svg.transition().duration(400).call(zoom.scaleBy, 0.625));
document.getElementById("zoom-reset").addEventListener("click", () => {
  svg.transition().duration(600).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity);
});

// ─── Zoom to Country ─────────────────────────────────────────────────────────
function zoomToCountry(feature) {
  try {
    const [[x0, y0], [x1, y1]] = path.bounds(feature);
    const dx = x1 - x0, dy = y1 - y0;
    if (!isFinite(dx) || !isFinite(dy) || dx < 1 || dy < 1) return;

    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;

    // Reserve space for the right panel (330px + 32px margins)
    const panelReserved = 378;
    const availW = width - panelReserved;

    const scaleX = (availW  * 0.7) / dx;
    const scaleY = (height  * 0.7) / dy;
    const scale  = Math.max(1.4, Math.min(10, Math.min(scaleX, scaleY)));

    // Center in the left portion of the viewport
    const tx = availW / 2 - scale * cx;
    const ty = height / 2 - scale * cy;

    svg.transition()
      .duration(800)
      .ease(d3.easeCubicInOut)
      .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  } catch (e) {
    console.warn("zoomToCountry failed:", e);
  }
}

// ─── Wikipedia Image Fetch ───────────────────────────────────────────────────
const imgCache = {};

async function fetchWikiImage(wikiTitle) {
  if (wikiTitle in imgCache) return imgCache[wikiTitle];
  const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(wikiTitle)}&prop=pageimages&format=json&pithumbsize=300&origin=*`;
  try {
    const res  = await fetch(url);
    const data = await res.json();
    const pages = data?.query?.pages;
    const src  = pages ? (Object.values(pages)[0]?.thumbnail?.source || null) : null;
    imgCache[wikiTitle] = src;
    return src;
  } catch {
    imgCache[wikiTitle] = null;
    return null;
  }
}

// ─── Panel Logic ──────────────────────────────────────────────────────────────
let selectedEl = null;
const infoPanel   = document.getElementById("info-panel");
const tooltip     = document.getElementById("tooltip");
const leaderImg   = document.getElementById("leader-img");
const leaderPlaceholder = document.getElementById("leader-placeholder");
const imgSpinner  = document.getElementById("img-spinner");

function showLeaderLoading() {
  leaderImg.classList.remove("loaded");
  leaderImg.style.display = "none";
  leaderPlaceholder.style.display = "flex";
  imgSpinner.classList.remove("hidden");
}
function showLeaderImage(src) {
  imgSpinner.classList.add("hidden");
  if (src) {
    leaderImg.src = src;
    leaderImg.style.display = "block";
    leaderImg.onload = () => leaderImg.classList.add("loaded");
    leaderPlaceholder.style.display = "none";
  } else {
    leaderImg.style.display = "none";
    leaderPlaceholder.style.display = "flex";
  }
}

async function openPanel(d) {
  const id   = String(d.id);
  const tData = TENSION_DATA[id];
  const lData = LEADER_DATA[id];
  const name  = tData ? tData.name : (d.properties?.name || "Unknown Territory");

  document.getElementById("panel-country").textContent = name;

  // Leader section
  const leaderNameEl  = document.getElementById("leader-name");
  const leaderTitleEl = document.getElementById("leader-title-el");
  const leaderWikiLink = document.getElementById("leader-wiki-link");

  if (lData) {
    leaderNameEl.textContent  = lData.name;
    leaderTitleEl.textContent = lData.title;
    if (lData.wiki) {
      leaderWikiLink.href        = `https://en.wikipedia.org/wiki/${encodeURIComponent(lData.wiki)}`;
      leaderWikiLink.textContent = "Wikipedia";
      leaderWikiLink.style.display = "inline";
      showLeaderLoading();
      const src = await fetchWikiImage(lData.wiki);
      showLeaderImage(src);
    } else {
      leaderWikiLink.style.display = "none";
      showLeaderImage(null);
    }
  } else {
    leaderNameEl.innerHTML  = '<span class="no-leader-note">No data available</span>';
    leaderTitleEl.textContent = "";
    leaderWikiLink.style.display = "none";
    imgSpinner.classList.add("hidden");
    leaderImg.style.display = "none";
    leaderPlaceholder.style.display = "flex";
  }

  // Tension section
  if (tData) {
    const color = LEVEL_COLORS[tData.level];
    const badge = document.getElementById("panel-badge");
    badge.innerHTML = `<span class="tooltip-dot" style="background:${color}"></span>${LEVEL_LABELS[tData.level]}`;
    badge.style.background   = LEVEL_BG[tData.level];
    badge.style.color        = color;
    badge.style.borderColor  = color + "44";

    const barEl = document.getElementById("panel-bar");
    barEl.style.width      = (tData.level / 5 * 100) + "%";
    barEl.style.background = color;

    document.getElementById("panel-summary").textContent = tData.summary;

    const ul = document.getElementById("panel-reasons");
    ul.innerHTML = "";
    tData.reasons.forEach(r => {
      const li = document.createElement("li");
      li.textContent = r;
      ul.appendChild(li);
    });
  } else {
    const badge = document.getElementById("panel-badge");
    badge.innerHTML      = "No data available";
    badge.style.background  = "rgba(33,38,45,0.5)";
    badge.style.color       = "#8b949e";
    badge.style.borderColor = "#30363d";
    document.getElementById("panel-bar").style.width = "0%";
    document.getElementById("panel-summary").textContent = "No political tension data is available for this territory.";
    document.getElementById("panel-reasons").innerHTML = "";
  }

  infoPanel.classList.add("open");
}

function closePanel() {
  infoPanel.classList.remove("open");
  if (selectedEl) { d3.select(selectedEl).classed("selected", false); selectedEl = null; }
}

document.getElementById("panel-close-btn").addEventListener("click", closePanel);
svg.on("click", closePanel);

// ─── Load Map ─────────────────────────────────────────────────────────────────
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
  const countries = topojson.feature(world, world.objects.countries);
  const borders   = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

  fitMap();

  countriesG.selectAll(".country")
    .data(countries.features)
    .join("path")
    .attr("class", "country")
    .attr("d", path)
    .attr("fill", d => {
      const t = TENSION_DATA[String(d.id)];
      return t ? LEVEL_COLORS[t.level] : "#21262d";
    })
    .on("mousemove", function(event, d) {
      const t     = TENSION_DATA[String(d.id)];
      const name  = t ? t.name : (d.properties?.name || "Unknown");
      const label = t ? LEVEL_LABELS[t.level] : "No data";
      const color = t ? LEVEL_COLORS[t.level] : "#484f58";

      tooltip.innerHTML = `<span class="tooltip-dot" style="background:${color}"></span><strong>${name}</strong> &mdash; ${label}`;
      tooltip.classList.add("visible");

      const rect = container.getBoundingClientRect();
      let x = event.clientX - rect.left + 14;
      let y = event.clientY - rect.top  - 10;
      if (x + 280 > width) x -= 290;
      tooltip.style.left = x + "px";
      tooltip.style.top  = y + "px";
    })
    .on("mouseleave", () => tooltip.classList.remove("visible"))
    .on("click", function(event, d) {
      event.stopPropagation();
      tooltip.classList.remove("visible");
      if (selectedEl) d3.select(selectedEl).classed("selected", false);
      d3.select(this).classed("selected", true);
      selectedEl = this;
      zoomToCountry(d);
      openPanel(d);
    });

  bordersG.append("path")
    .datum(borders)
    .attr("class", "borders")
    .attr("d", path);

  window.addEventListener("resize", () => {
    width  = container.clientWidth;
    height = container.clientHeight;
    fitMap();
  });
}).catch(() => {
  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f85149;flex-direction:column;gap:12px;">
      <div style="font-size:1.1rem;">Failed to load map data</div>
      <div style="font-size:0.8rem;color:#8b949e;">Check your internet connection and reload the page.</div>
    </div>`;
});
</script>

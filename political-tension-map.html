<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 24px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; font-size: 0.75rem; padding: 5px 12px;
      cursor: pointer; letter-spacing: 0.03em; white-space: nowrap;
      transition: background 0.15s, color 0.15s; font-family: inherit; text-decoration: none;
    }
    .back-btn:hover { background: #21262d; color: #f0f6fc; }
    .brand-badge {
      background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.3);
      border-radius: 4px; padding: 3px 8px; font-size: 0.65rem;
      letter-spacing: 0.1em; color: #58a6ff; text-transform: uppercase; white-space: nowrap;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; color: #f0f6fc; }
    header p  { font-size: 0.72rem; color: #8b949e; margin-top: 2px; }

    .legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #8b949e; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    .map-container { flex: 1; position: relative; overflow: hidden; }

    #map-svg { width: 100%; height: 100%; cursor: grab; }
    #map-svg:active { cursor: grabbing; }

    .country {
      stroke: #30363d;
      stroke-width: 0.4px;
      transition: opacity 0.15s;
      cursor: pointer;
    }
    .country:hover { opacity: 0.75; stroke: #8b949e; stroke-width: 1px; }
    .country.selected { stroke: #f0f6fc; stroke-width: 1.8px; opacity: 1 !important; }

    .graticule { fill: none; stroke: #1c2128; stroke-width: 0.5px; }
    .sphere { fill: #0a1628; }
    .borders { fill: none; stroke: #30363d; stroke-width: 0.4px; pointer-events: none; }

    /* Tooltip */
    #tooltip {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      color: #e6edf3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      white-space: nowrap;
      z-index: 10;
    }
    #tooltip.visible { opacity: 1; }
    .tooltip-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }

    /* Info Panel */
    #info-panel {
      position: absolute;
      right: 16px;
      top: 16px;
      width: 330px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      z-index: 20;
      transform: translateX(380px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }
    #info-panel.open { transform: translateX(0); }

    .panel-close {
      position: absolute;
      top: 12px; right: 14px;
      background: none; border: none;
      color: #8b949e; font-size: 1.1rem;
      cursor: pointer; line-height: 1;
      padding: 2px 6px; border-radius: 4px;
    }
    .panel-close:hover { background: #21262d; color: #f0f6fc; }

    .panel-country {
      font-size: 1.15rem; font-weight: 600;
      color: #f0f6fc; margin-bottom: 14px;
      padding-right: 24px; line-height: 1.3;
    }

    /* Leader section */
    .leader-section {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #21262d;
    }

    .leader-img-wrap {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      background: #21262d;
      border: 2px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #leader-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      display: none;
      border-radius: 50%;
    }
    #leader-img.loaded { display: block; }

    #leader-placeholder {
      font-size: 2rem;
      color: #484f58;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .img-spinner {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .img-spinner::after {
      content: '';
      width: 22px; height: 22px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .img-spinner.hidden { display: none; }

    .leader-info { min-width: 0; }
    .leader-name {
      font-size: 0.88rem; font-weight: 600;
      color: #e6edf3; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leader-title-text { font-size: 0.73rem; color: #8b949e; line-height: 1.4; }
    .leader-wiki-link {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.68rem;
      color: #58a6ff;
      text-decoration: none;
    }
    .leader-wiki-link:hover { text-decoration: underline; }
    .no-leader-note { font-size: 0.75rem; color: #484f58; font-style: italic; }

    .tension-badge {
      display: inline-flex;
      align-items: center; gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem; font-weight: 600;
      margin-bottom: 14px;
      border: 1px solid transparent;
    }

    .tension-bar-wrap {
      background: #21262d;
      border-radius: 4px; height: 6px;
      margin-bottom: 16px; overflow: hidden;
    }
    .tension-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

    .panel-section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .panel-summary {
      font-size: 0.85rem; color: #c9d1d9;
      line-height: 1.6; margin-bottom: 16px;
    }

    .reasons-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .reasons-list li {
      font-size: 0.8rem; color: #8b949e;
      display: flex; align-items: flex-start;
      gap: 8px; line-height: 1.5;
    }
    .reasons-list li::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #58a6ff;
      margin-top: 6px; flex-shrink: 0;
    }

    /* Zoom controls */
    .zoom-controls {
      position: absolute;
      left: 16px; bottom: 20px;
      display: flex; flex-direction: column;
      gap: 4px; z-index: 10;
    }
    .zoom-btn {
      width: 32px; height: 32px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px; color: #8b949e;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .zoom-btn:hover { background: #21262d; color: #f0f6fc; }

    .hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem; color: #484f58;
      pointer-events: none; white-space: nowrap;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  </style>

    <div class="panel-section-title">Key Tension Factors</div>
    <ul class="reasons-list" id="panel-reasons"></ul>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in">+</button>
    <button class="zoom-btn" id="zoom-out">&#x2212;</button>
    <button class="zoom-btn" id="zoom-reset" title="Reset view" style="font-size:0.75rem;">&#x25A1;</button>
  </div>
  <div class="hint">Scroll to zoom &bull; Drag to pan &bull; Click a country for details</div>
</div>

// ─── Constants ────────────────────────────────────────────────────────────────
const LEVEL_COLORS = { 1:"#2d6a4f", 2:"#52b788", 3:"#f4a261", 4:"#e76f51", 5:"#9d0208" };
const LEVEL_LABELS = { 1:"Stable", 2:"Low Tension", 3:"Moderate Tension", 4:"High Tension", 5:"Critical / Active Conflict" };
const LEVEL_BG     = { 1:"rgba(45,106,79,0.2)", 2:"rgba(82,183,136,0.2)", 3:"rgba(244,162,97,0.2)", 4:"rgba(231,111,81,0.2)", 5:"rgba(157,2,8,0.2)" };

// ─── Map Setup ────────────────────────────────────────────────────────────────
const svgEl    = document.getElementById("map-svg");
const svg      = d3.select(svgEl);
const container = document.querySelector(".map-container");

let width  = container.clientWidth;
let height = container.clientHeight;

const projection = d3.geoNaturalEarth1();
const path       = d3.geoPath().projection(projection);

const g         = svg.append("g");
const sphereEl  = g.append("path").datum({type:"Sphere"}).attr("class","sphere");
const graticule = g.append("path").datum(d3.geoGraticule()()).attr("class","graticule");
const countriesG = g.append("g");
const bordersG   = g.append("g");

function fitMap() {
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  projection.fitSize([width, height], {type:"Sphere"});
  sphereEl.attr("d", path({type:"Sphere"}));
  graticule.attr("d", path(d3.geoGraticule()()));
  countriesG.selectAll(".country").attr("d", d => path(d));
  bordersG.selectAll("path").attr("d", d => path(d));
}

// ─── Zoom ─────────────────────────────────────────────────────────────────────
const zoom = d3.zoom()
  .scaleExtent([0.8, 12])
  .on("zoom", e => g.attr("transform", e.transform));

svg.call(zoom);

document.getElementById("zoom-in").addEventListener("click",  () => svg.transition().duration(400).call(zoom.scaleBy, 1.6));
document.getElementById("zoom-out").addEventListener("click", () => svg.transition().duration(400).call(zoom.scaleBy, 0.625));
document.getElementById("zoom-reset").addEventListener("click", () => {
  svg.transition().duration(600).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity);
});

// ─── Zoom to Country ─────────────────────────────────────────────────────────
function zoomToCountry(feature) {
  try {
    const [[x0, y0], [x1, y1]] = path.bounds(feature);
    const dx = x1 - x0, dy = y1 - y0;
    if (!isFinite(dx) || !isFinite(dy) || dx < 1 || dy < 1) return;

    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;

    // Reserve space for the right panel (330px + 32px margins)
    const panelReserved = 378;
    const availW = width - panelReserved;

    const scaleX = (availW  * 0.7) / dx;
    const scaleY = (height  * 0.7) / dy;
    const scale  = Math.max(1.4, Math.min(10, Math.min(scaleX, scaleY)));

    // Center in the left portion of the viewport
    const tx = availW / 2 - scale * cx;
    const ty = height / 2 - scale * cy;

    svg.transition()
      .duration(800)
      .ease(d3.easeCubicInOut)
      .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  } catch (e) {
    console.warn("zoomToCountry failed:", e);
  }
}

// ─── Wikipedia Image Fetch ───────────────────────────────────────────────────
const imgCache = {};

async function fetchWikiImage(wikiTitle) {
  if (wikiTitle in imgCache) return imgCache[wikiTitle];
  const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(wikiTitle)}&prop=pageimages&format=json&pithumbsize=300&origin=*`;
  try {
    const res  = await fetch(url);
    const data = await res.json();
    const pages = data?.query?.pages;
    const src  = pages ? (Object.values(pages)[0]?.thumbnail?.source || null) : null;
    imgCache[wikiTitle] = src;
    return src;
  } catch {
    imgCache[wikiTitle] = null;
    return null;
  }
}

// ─── Panel Logic ──────────────────────────────────────────────────────────────
let selectedEl = null;
const infoPanel   = document.getElementById("info-panel");
const tooltip     = document.getElementById("tooltip");
const leaderImg   = document.getElementById("leader-img");
const leaderPlaceholder = document.getElementById("leader-placeholder");
const imgSpinner  = document.getElementById("img-spinner");

function showLeaderLoading() {
  leaderImg.classList.remove("loaded");
  leaderImg.style.display = "none";
  leaderPlaceholder.style.display = "flex";
  imgSpinner.classList.remove("hidden");
}
function showLeaderImage(src) {
  imgSpinner.classList.add("hidden");
  if (src) {
    leaderImg.src = src;
    leaderImg.style.display = "block";
    leaderImg.onload = () => leaderImg.classList.add("loaded");
    leaderPlaceholder.style.display = "none";
  } else {
    leaderImg.style.display = "none";
    leaderPlaceholder.style.display = "flex";
  }
}

async function openPanel(d) {
  const id   = String(d.id);
  const tData = TENSION_DATA[id];
  const lData = LEADER_DATA[id];
  const name  = tData ? tData.name : (d.properties?.name || "Unknown Territory");

  document.getElementById("panel-country").textContent = name;

  // Leader section
  const leaderNameEl  = document.getElementById("leader-name");
  const leaderTitleEl = document.getElementById("leader-title-el");
  const leaderWikiLink = document.getElementById("leader-wiki-link");

  if (lData) {
    leaderNameEl.textContent  = lData.name;
    leaderTitleEl.textContent = lData.title;
    if (lData.wiki) {
      leaderWikiLink.href        = `https://en.wikipedia.org/wiki/${encodeURIComponent(lData.wiki)}`;
      leaderWikiLink.textContent = "Wikipedia";
      leaderWikiLink.style.display = "inline";
      showLeaderLoading();
      const src = await fetchWikiImage(lData.wiki);
      showLeaderImage(src);
    } else {
      leaderWikiLink.style.display = "none";
      showLeaderImage(null);
    }
  } else {
    leaderNameEl.innerHTML  = '<span class="no-leader-note">No data available</span>';
    leaderTitleEl.textContent = "";
    leaderWikiLink.style.display = "none";
    imgSpinner.classList.add("hidden");
    leaderImg.style.display = "none";
    leaderPlaceholder.style.display = "flex";
  }

  // Tension section
  if (tData) {
    const color = LEVEL_COLORS[tData.level];
    const badge = document.getElementById("panel-badge");
    badge.innerHTML = `<span class="tooltip-dot" style="background:${color}"></span>${LEVEL_LABELS[tData.level]}`;
    badge.style.background   = LEVEL_BG[tData.level];
    badge.style.color        = color;
    badge.style.borderColor  = color + "44";

    const barEl = document.getElementById("panel-bar");
    barEl.style.width      = (tData.level / 5 * 100) + "%";
    barEl.style.background = color;

    document.getElementById("panel-summary").textContent = tData.summary;

    const ul = document.getElementById("panel-reasons");
    ul.innerHTML = "";
    tData.reasons.forEach(r => {
      const li = document.createElement("li");
      li.textContent = r;
      ul.appendChild(li);
    });
  } else {
    const badge = document.getElementById("panel-badge");
    badge.innerHTML      = "No data available";
    badge.style.background  = "rgba(33,38,45,0.5)";
    badge.style.color       = "#8b949e";
    badge.style.borderColor = "#30363d";
    document.getElementById("panel-bar").style.width = "0%";
    document.getElementById("panel-summary").textContent = "No political tension data is available for this territory.";
    document.getElementById("panel-reasons").innerHTML = "";
  }

  infoPanel.classList.add("open");
}

function closePanel() {
  infoPanel.classList.remove("open");
  if (selectedEl) { d3.select(selectedEl).classed("selected", false); selectedEl = null; }
}

document.getElementById("panel-close-btn").addEventListener("click", closePanel);
svg.on("click", closePanel);

// ─── Load Map ─────────────────────────────────────────────────────────────────
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
  const countries = topojson.feature(world, world.objects.countries);
  const borders   = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

  fitMap();

  countriesG.selectAll(".country")
    .data(countries.features)
    .join("path")
    .attr("class", "country")
    .attr("d", path)
    .attr("fill", d => {
      const t = TENSION_DATA[String(d.id)];
      return t ? LEVEL_COLORS[t.level] : "#21262d";
    })
    .on("mousemove", function(event, d) {
      const t     = TENSION_DATA[String(d.id)];
      const name  = t ? t.name : (d.properties?.name || "Unknown");
      const label = t ? LEVEL_LABELS[t.level] : "No data";
      const color = t ? LEVEL_COLORS[t.level] : "#484f58";

      tooltip.innerHTML = `<span class="tooltip-dot" style="background:${color}"></span><strong>${name}</strong> &mdash; ${label}`;
      tooltip.classList.add("visible");

      const rect = container.getBoundingClientRect();
      let x = event.clientX - rect.left + 14;
      let y = event.clientY - rect.top  - 10;
      if (x + 280 > width) x -= 290;
      tooltip.style.left = x + "px";
      tooltip.style.top  = y + "px";
    })
    .on("mouseleave", () => tooltip.classList.remove("visible"))
    .on("click", function(event, d) {
      event.stopPropagation();
      tooltip.classList.remove("visible");
      if (selectedEl) d3.select(selectedEl).classed("selected", false);
      d3.select(this).classed("selected", true);
      selectedEl = this;
      zoomToCountry(d);
      openPanel(d);
    });

  bordersG.append("path")
    .datum(borders)
    .attr("class", "borders")
    .attr("d", path);

  window.addEventListener("resize", () => {
    width  = container.clientWidth;
    height = container.clientHeight;
    fitMap();
  });
}).catch(() => {
  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f85149;flex-direction:column;gap:12px;">
      <div style="font-size:1.1rem;">Failed to load map data</div>
      <div style="font-size:0.8rem;color:#8b949e;">Check your internet connection and reload the page.</div>
    </div>`;
});
</script>
